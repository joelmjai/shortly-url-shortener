spring.application.name=url-shortner-sb

# In-memory H2 so tests need no external database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Base64 string that decodes to 48 bytes (matches the app's HS384 signing)
jwt.secret=b1025cc8b8ec90b8261bb741e31e31f3d6ebc921ab6e0d1e3f4b519cd4175432
jwt.expiration=172800000
